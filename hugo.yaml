baseURL: "https://docs.yousysadmin.com/"
title: Documentation
#publishDir: public/docs

module:
  imports:
  - path: github.com/imfing/hextra
  hugoVersion:
    extended: true
    min: 0.146.0

disableKinds:
  - taxonomy
  - term

enableEmoji: true
enableGitInfo: true
enableInlineShortcodes: true
hasCJKLanguage: true

languageCode: en-US

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: changelog
      name: Changelog
      pageRef: /changelog
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/yousysadmin/documentation-framework"
      params:
        icon: github

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: infraCodeRepo
      name: "Infrastructure Repository ↗"
      url: "https://github.com/yousysadmin/documentation-framework"
      weight: 2
    - identifier: appCodeRepo
      name: "Application Repository ↗"
      url: "https://github.com/yousysadmin/documentation-framework"
      weight: 3

outputs:
  home: [HTML, LLMS]
  page: [HTML, Markdown]
  section: [HTML, Markdown, RSS]

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

  Markdown:
    baseName: index.html

pagination:
  pagerSize: 21 # Number of entries in Changelog section before pagination

params:
  description: Documentation
  # Enable/Disable show dev notes
  devNotes:
    enabled: true

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      pagerSize: 20

    article:
      displayPagination: true

  displayUpdatedDate: true
  dateFormat: January 2, 2006

  editURL:
    enable: true
    base: "https://github.com/YouSysAdmin/documentation-framework/edit/master/content"

  externalLinkDecoration: true

  footer:
    enable: false
    displayCopyright: false
    displayPoweredBy: false
    width: normal

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  images:
  - images/feature.png

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/doc-logo-dark.svg
      dark: images/doc-logo-white.svg
      link: /
      width: 175
    width: wide

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: full
    tabs:
      sync: true

  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      tokenize: forward

  theme:
    # light | dark | system
    default: system
    displayToggle: true

privacy:
  youtube:
    privacyEnhanced: true
